name: Update Premier data and deploy site

on:
  schedule:
    - cron: "0 6,18 * * *"   # tous les jours à 06:00 et 18:00 UTC
  workflow_dispatch: {}       # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Premier leaderboard
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
        run: python3 fetch_premier_data.py

      - name: Commit updated data
        run: |
          git config user.name "premier-bot"
          git config user.email "actions@github.com"
          git add data/leaderboard.json
          git diff --cached --quiet || git commit -m "Auto: mise à jour du classement"
          git push

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
